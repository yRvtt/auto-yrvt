name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --icon "auto_yrvt/resources/icon.ico" --add-data "auto_yrvt/resources/icon.ico;auto_yrvt/resources" --collect-all pywinauto --collect-all comtypes --name AutoYrvt run.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoYrvt.exe
          generate_release_notes: true
